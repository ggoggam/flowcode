# The tests that `mise run test` deselects, run on a schedule instead of per-PR.
#
# tests/test_convergence.py trains toy GFlowNets to convergence and is the only thing in the
# repo proving the objectives are mathematically correct. It is also minutes long against ~11s
# for the rest of the suite, which made it the overwhelming majority of the PR wall clock.
# Rather than delete the coverage, it carries a `slow` marker, comes out of the default
# selection, and runs here nightly — a regression surfaces within a day instead of on the next
# PR that happens to touch the objectives.
name: Slow tests

on:
  schedule:
    # 04:00 UTC daily. Nothing depends on the hour beyond staying clear of the working day.
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  slow:
    name: slow tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Resolve mise version from mise.toml
        id: mise_version
        run: |
          v=$(sed -n 's/^min_version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' mise.toml)
          test -n "$v" || { echo "::error::could not parse min_version from mise.toml"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ~/.local/share/mise
          key: mise-${{ runner.os }}-${{ hashFiles('mise.toml', 'mise.lock') }}
          restore-keys: |
            mise-${{ runner.os }}-

      - uses: jdx/mise-action@v3
        with:
          version: ${{ steps.mise_version.outputs.version }}
          cache: false

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/uv
            .venv
          key: test-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            test-${{ runner.os }}-

      # Selects *only* the slow marker. A -m on the command line replaces the one in addopts
      # rather than intersecting with it, so this runs what `mise run test` skips.
      - name: Slow tests
        run: mise run test:slow
