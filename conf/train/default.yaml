steps: 1000

# Each step samples `groups_per_step` distinct prompts × `group_size` completions. VarGrad and
# any group-baseline estimator need group_size > 1; group_size=1 silently degrades them.
groups_per_step: 8
group_size: 8

temperature: 1.0
top_p: 1.0
max_tokens: 512

# Two optimizers, deliberately. The policy is a LoRA on Tinker's side stepped via optim_step;
# log Z / log F are local torch params. Flow parameters need a much higher LR — they are
# fitting a scalar per prompt, not a language model, and at the policy LR they lag so far
# behind that the TB residual is dominated by log Z error rather than policy error.
policy_lr: 1.0e-5
flow_lr: 1.0e-2
lr_schedule: cosine # linear | cosine | constant
warmup_steps: 10
grad_clip_norm: 1.0

# Off-policy replay. This is a core reason to prefer GFlowNets here: the objectives are
# off-policy-consistent by construction, so stale trajectories remain valid training signal
# without importance correction — unlike PPO, which needs ratio clipping to survive it.
replay:
  enabled: true
  capacity: 10000
  fraction: 0.25 # share of each batch drawn from replay rather than fresh rollouts
  prioritize: reward # reward | uniform | recency

# When true, sampler weights are synced immediately before every rollout and the sampler's own
# logprobs are reused as the current-policy logprobs — skipping the forward() oracle pass and
# roughly halving the training-token bill. Incompatible with replay (stale trajectories were
# generated by a different policy), so the loop rejects the combination rather than silently
# training on wrong logprobs.
on_policy_only: false

sync_sampler_every: 1
log_every: 1
eval_every: 50
checkpoint_every: 100
