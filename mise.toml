# Floor for local use AND the exact version CI installs: ci.yml and slow-tests.yml parse this
# line and pass it to jdx/mise-action as `version:`, so there is one place to bump and CI runs
# the declared floor rather than whatever the runner image happens to ship.
min_version = "2026.8.5"

[tools]
# uv manages the interpreter itself (`.python-version` pins 3.12), so python is deliberately
# NOT a mise tool here. Two installers owning the same runtime is how you get a venv built
# against one interpreter and imported by another.
uv = "latest"
# Runs the hooks in .pre-commit-config.yaml (see the `pre-commit` task). This was inherited
# from the monorepo root's shared [tools] table before flowcode was split out; it has to be
# declared here now that nothing sits above this file.
prek = "latest"

[settings]
# Pin exact tool versions (and per-platform URLs/checksums) in mise.lock, which is committed.
# jdx/mise-action runs `mise install --locked` when a lock is present, and CI hashes the lock
# into its tool-cache key. Refresh with:
#   mise lock -p linux-x64,linux-x64-musl,linux-arm64,linux-arm64-musl,macos-arm64,macos-x64,windows-x64
# Pass the whole platform list — a narrower `-p` writes only those and drops the rest of the
# coverage. `--locked` hard-fails for a tool with no entry for the runner's platform, so the
# lock has to stay complete.
lockfile = true

[env]
# Tinker reads TINKER_API_KEY from the environment. In the monorepo this pointed at the
# workspace-root .env ("../.env") so one credential served every project; standalone, the key
# lives in this repo's own gitignored .env.
# `_.file` is a no-op when the file is absent, so a fresh clone without a key still loads.
_.file = ".env"

[tasks.sync]
description = "Install the locked dependency set into .venv"
run = "uv sync --all-extras --group dev"

[tasks.test]
description = "Run the unit tests (skips network- and Tinker-marked tests)"
run = "uv run pytest"

[tasks."test:all"]
description = "Run every test including the network-dependent dataset loaders (no Tinker spend)"
run = "uv run pytest -m 'not tinker'"

[tasks."test:slow"]
description = "Run only the slow convergence suite (deselected from `test`; run nightly in CI)"
# A -m on the command line replaces the one in addopts rather than adding to it, so this
# selects the slow tests that `test` skips instead of intersecting with its exclusions.
run = "uv run pytest -m slow"

[tasks.lint]
description = "Lint with ruff and type-check with ty"
# --exit-zero-on-warning is what makes `unresolved-import = "warn"` in pyproject.toml mean
# what it says: ty exits 1 on warning-level diagnostics by default, so downgrading the rule
# kept the diagnostic readable but still failed the build. The two imports it fires on are
# the lazy `datasets` and `wandb` ones, deliberately optional extras — CI syncs without them,
# so they resolve locally (a venv built with --all-extras) and nowhere else, which is exactly
# how this passed review and broke in CI. Error-level diagnostics still exit 1.
run = ["uv run ruff check .", "uv run ty check --exit-zero-on-warning src tests"]

[tasks.fmt]
description = "Format Python code with ruff and apply safe lint fixes"
run = ["uv run ruff format .", "uv run ruff check --fix ."]

[tasks."fmt:check"]
description = "Fail if any Python file needs reformatting"
run = "uv run ruff format --check ."

[tasks.check]
description = "Full check suite: lint + test"
depends = ["lint", "test"]

[tasks.train]
description = "Run a training job. Usage: mise run train -- objective=vargrad env=mbpp"
run = "uv run flowcode-train"

[tasks.sweep]
description = "Hydra multirun sweep. Usage: mise run sweep -- objective=tb,subtb,vargrad"
run = "uv run flowcode-train --multirun"

[tasks.cost]
description = "Price a config before spending. Usage: mise run cost -- train.steps=1000"
run = "uv run flowcode-cost"

[tasks."pre-commit"]
description = "Run pre-commit checks via prek"
run = "prek run --show-diff-on-failure --color=always --all-files --hook-stage=manual"
